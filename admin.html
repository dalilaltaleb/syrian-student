<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دخول الإدارة | دليل الطالب السوري</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .admin-login {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 10px;
        }

        .login-box p {
            margin-bottom: 25px;
            opacity: 0.7;
        }

        .login-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
        }

        #login-message {
            margin-top: 15px;
            font-size: 14px;
        }

        body.dark-mode .login-box {
            background: #1e1e1e;
            color: white;
        }

        body.dark-mode .login-box input {
            background: #2a2a2a;
            color: white;
            border-color: #444;
        }
    </style>
</head>

<body>

    <main class="admin-login">

        <div class="login-box">

            <h1> دخول الإدارة</h1>

            <p>دليل الطالب السوري</p>

            <form id="login-form">

                <input
                    type="email"
                    id="email"
                    placeholder="البريد الإلكتروني"
                    required
                    autocomplete="email"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="كلمة المرور"
                    required
                    autocomplete="current-password"
                >

                <button type="submit">
                    تسجيل الدخول
                </button>

            </form>

            <div id="login-message"></div>

        </div>

    </main>

    <script type="module" src="admin.js"></script>

</body>
</html>
